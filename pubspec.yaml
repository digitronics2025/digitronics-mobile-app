name: digitronics
description: "Digitronics - Official mobile app for digitronics.ma"
publish_to: 'none'
version: 1.0.7+7

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  connectivity_plus: ^7.1.0
  share_plus: ^12.0.2
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^20.1.0
  in_app_review: ^2.0.10
  shared_preferences: ^2.3.4
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/adaptive_bg.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/splash/splash_logo.png"
  android: true
  ios: false
  android_12:
    color: "#FFFFFF"
    image: "assets/splash/splash_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/
    - assets/Back.jpg
    - assets/Digitronics.png
    - assets/logo.png
