name: digitronics
description: "Digitronics - Official mobile app for digitronics.ma"
publish_to: 'none'
version: 1.0.13+13

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  connectivity_plus: ^7.1.0
  share_plus: ^12.0.2
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^20.1.0
  in_app_review: ^2.0.10
  shared_preferences: ^2.3.4
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Fake WebView for test/webview_screen_test.dart.
  webview_flutter_platform_interface: ^2.14.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: false
  # Transparent sphere (not the dark-navy tile) so the icon reads as the logo.
  image_path: "assets/icon/app_icon_foreground.png"
  # Clean white background instead of the old black/navy box the logo sat on.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  # Brand red so the OS splash flows seamlessly into the red Flutter splash
  # (was white/pink, which clashed on launch).
  color: "#E4232B"
  # Sphere with transparent margins so the full round logo floats on red
  # (splash_logo.png is a tight square crop that showed hard corners).
  image: "assets/icon/app_icon_foreground.png"
  android: true
  ios: false
  android_12:
    color: "#E4232B"
    image: "assets/icon/app_icon_foreground.png"
    icon_background_color: "#E4232B"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/
    - assets/Back.jpg
    - assets/Digitronics.png
    - assets/logo.png
