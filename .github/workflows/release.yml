name: Release Android

# Builds a SIGNED Android App Bundle (.aab) in the cloud so releases never depend
# on a local Flutter/Windows setup. Optionally uploads it to the Google Play
# internal track as a draft (opt-in, never auto-rolls-out to production).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICES_JSON_BASE64  base64 of android/app/google-services.json (Firebase)
#   ANDROID_KEYSTORE_BASE64      base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD    keystore (store) password
#   ANDROID_KEY_ALIAS            key alias
#   ANDROID_KEY_PASSWORD         key password
#   PLAY_SERVICE_ACCOUNT_JSON    (optional) Play Developer API service-account JSON,
#                                only needed to auto-upload to Play
#
# Make a base64 secret on Windows PowerShell:
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("upload-keystore.jks")) | Set-Clipboard

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also upload the AAB to Google Play (internal track, draft)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build signed app bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --- Restore gitignored files the Android build needs ---
      - name: Restore Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is missing."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Write key.properties
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          storeFile=upload-keystore.jks
          EOF

      - run: flutter pub get

      # Regenerate launcher icons + native splash from pubspec so the shipped app
      # picks up the current brand assets (white icon background, red OS splash).
      - run: dart run flutter_launcher_icons
      - run: dart run flutter_native_splash:create

      - run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Installable APK for sideloading onto a phone to preview a build without
      # going through the Play Store. Signed with the same release key.
      - run: flutter build apk --release

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Opt-in publish: only on a manual run with the box ticked. Uploads as a
      # DRAFT to the internal track, so you still promote to production by hand
      # in the Play Console. (The step fails clearly if PLAY_SERVICE_ACCOUNT_JSON
      # is unset — the `secrets` context is not allowed in an `if:`.)
      - name: Publish to Google Play (internal, draft)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.maroc.digitronics
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
